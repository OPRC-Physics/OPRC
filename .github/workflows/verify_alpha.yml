name: OPRC Research Pipeline 
on: 
  push: 
    branches: [ main, project-beta-doping ] 
jobs: 
  verify-beta: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
      - name: Set up Python 
        uses: actions/setup-python@v5 
        with: 
          python-version: '3.10' 
      - name: Install dependencies 
        run: pip install numpy matplotlib 
      - name: Run Beta Simulations 
        run: python research/002-doping-physics/simulations/trap_visualization.py 
