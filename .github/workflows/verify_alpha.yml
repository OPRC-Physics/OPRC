name: OPRC Project Alpha Verification
on:
  push:
    branches: [ main, project-alpha-insulators ]
  workflow_dispatch:

jobs:
  build_verdict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install numpy matplotlib

      - name: Run Physics Simulations
        # This tells GitHub to look inside the specific research folder
        working-directory: ./research/001-electron-localization
        run: |
          python band_gap_simulation.py
          python thermal_occupancy.py
          python localization_plot.py

      - name: Compile Final Verdict PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: research/001-electron-localization/final_verdict.tex

      - name: Upload Verdict
        uses: actions/upload-artifact@v4
        with:
          name: OPRC-Final-Verdict
          path: final_verdict.pdf
